<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Data Kelas</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background-color: #f9f9f9; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background-color: #795548; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: white; padding: 12px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; border-left: 5px solid #795548; }
    </style>
</head>
<body>

    <h2>Data Kelas</h2>

    <!-- Form Tambah Kelas -->
    <div class="card">
        <h3>Tambah Kelas Baru</h3>
        <input type="text" id="namaKelas" placeholder="Masukkan nama kelas (misal: X-1)">
        <button onclick="tambahKelas()" id="btnSimpan">Simpan</button>
    </div>

    <!-- Daftar Kelas -->
    <h3>Daftar Kelas</h3>
    <div id="loading">Memuat data...</div>
    <ul id="daftarKelas"></ul>

    <script>
        // URL Web App Anda
        const API_URL = "https://script.google.com/macros/s/AKfycbxF4zckZ_fv3ZxAnCXOUMIB41pMrx68sT941AcB8c1saPma8z6V71MsRnEIiqj2BeJG/exec";

        // Fungsi Ambil Data dari Google Sheets (Read)
        function muatData() {
            document.getElementById('loading').style.display = 'block';
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    const list = document.getElementById('daftarKelas');
                    list.innerHTML = "";
                    
                    data.forEach(item => {
                        if(item.nama_kelas) {
                            let li = document.createElement('li');
                            li.innerHTML = `<span><b>${item.nama_kelas}</b></span> <small style="color:gray">${item.id}</small>`;
                            list.appendChild(li);
                        }
                    });
                })
                .catch(err => {
                    document.getElementById('loading').innerText = "Gagal memuat data.";
                    console.error(err);
                });
        }

        // Fungsi Tambah Data ke Google Sheets (Create)
        function tambahKelas() {
            const input = document.getElementById('namaKelas');
            const nama = input.value.trim();
            const btn = document.getElementById('btnSimpan');

            if (!nama) return alert("Nama kelas tidak boleh kosong!");

            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ nama_kelas: nama })
            })
            .then(response => response.json())
            .then(res => {
                alert(res.message);
                input.value = "";
                btn.innerText = "Simpan";
                btn.disabled = false;
                muatData(); // Refresh daftar kelas
            })
            .catch(err => {
                alert("Gagal menyimpan data.");
                btn.innerText = "Simpan";
                btn.disabled = false;
                console.error(err);
            });
        }

        // Jalankan fungsi muat data saat pertama kali halaman dibuka
        muatData();
    </script>
</body>
</html>
