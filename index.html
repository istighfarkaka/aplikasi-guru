<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Data Kelas</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background-color: #f9f9f9; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background-color: #795548; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: white; padding: 12px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; border-left: 5px solid #795548; }
    </style>
</head>
<body>

    <h2>Data Kelas</h2>

    <div class="card">
        <h3>Tambah Kelas Baru</h3>
        <input type="text" id="namaKelas" placeholder="Masukkan nama kelas (misal: X TSM)">
        <button onclick="tambahKelas()" id="btnSimpan">Simpan</button>
    </div>

    <h3>Daftar Kelas</h3>
    <div id="loading">Memuat data...</div>
    <ul id="daftarKelas"></ul>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxF4zckZ_fv3ZxAnCXOUMIB41pMrx68sT941AcB8c1saPma8z6V71MsRnEIiqj2BeJG/exec";

        function muatData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = "Memuat data...";
            
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    const list = document.getElementById('daftarKelas');
                    list.innerHTML = "";
                    
                    if (data.length === 0) {
                        list.innerHTML = "<li style='border-left:none;'>Belum ada data kelas.</li>";
                        return;
                    }

                    data.forEach(item => {
                        let li = document.createElement('li');
                        li.innerHTML = `<span><b>${item.nama_kelas}</b></span> <small style="color:gray">${item.id}</small>`;
                        list.appendChild(li);
                    });
                })
                .catch(err => {
                    document.getElementById('loading').innerText = "Gagal memuat data. Pastikan jaringan lancar.";
                    console.error(err);
                });
        }

        function tambahKelas() {
            const input = document.getElementById('namaKelas');
            const nama = input.value.trim();
            const btn = document.getElementById('btnSimpan');

            if (!nama) return alert("Nama kelas tidak boleh kosong!");

            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            // Mengirim data menggunakan URLSearchParams untuk menghindari blokir CORS
            fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "nama_kelas=" + encodeURIComponent(nama)
            })
            .then(() => {
                alert("Data berhasil dikirim!");
                input.value = "";
                btn.innerText = "Simpan";
                btn.disabled = false;
                setTimeout(muatData, 1500); // Beri jeda 1.5 detik lalu refresh data
            })
            .catch(err => {
                alert("Gagal menyimpan data.");
                btn.innerText = "Simpan";
                btn.disabled = false;
                console.error(err);
            });
        }

        muatData();
    </script>
</body>
</html>
